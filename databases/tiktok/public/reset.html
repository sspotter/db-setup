<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>Reset your Tik Surfer password</title>
    <style>
        body { font-family: system-ui, sans-serif; background: #0f1226; color: #eee; display: flex; justify-content: center; padding: 60px 16px; }
        form { background: #1b1f3a; padding: 28px; border-radius: 12px; width: 100%; max-width: 360px; }
        input, button { width: 100%; box-sizing: border-box; padding: 10px; margin-top: 12px; border-radius: 8px; border: 0; font-size: 15px; }
        button { background: #6c5ce7; color: #fff; cursor: pointer; }
        #msg { margin-top: 14px; min-height: 1.2em; }
    </style>
</head>
<body>
    <form id="f">
        <h2>Set a new password</h2>
        <input id="pw" type="password" placeholder="New password (min 8 characters)" minlength="8" required autocomplete="new-password">
        <input id="pw2" type="password" placeholder="Confirm password" minlength="8" required autocomplete="new-password">
        <button type="submit">Reset password</button>
        <div id="msg"></div>
    </form>
    <script>
        const token = new URLSearchParams(location.search).get('token');
        const msg = document.getElementById('msg');
        document.getElementById('f').addEventListener('submit', async (e) => {
            e.preventDefault();
            const pw = document.getElementById('pw').value;
            if (pw !== document.getElementById('pw2').value) { msg.textContent = 'Passwords do not match.'; return; }
            if (!token) { msg.textContent = 'This link is missing its token.'; return; }
            try {
                const res = await fetch('/api/auth/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, password: pw }),
                });
                const data = await res.json();
                msg.textContent = res.ok ? 'Password updated. You can now sign in from the extension.' : (data.error || 'Reset failed.');
                if (res.ok) e.target.querySelectorAll('input,button').forEach(x => x.disabled = true);
            } catch { msg.textContent = 'Network error — try again.'; }
        });
    </script>
</body>
</html>
