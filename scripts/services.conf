# The backend service inventory — the single source of truth.
#
# Every script that needs a unit name, a port or a working directory reads it
# from here. This file exists because those facts used to be hard-coded in four
# separate scripts; when the APIs moved from 3030/3033 to 8443/8442 only one of
# them was updated, and `status.sh` reported both services dead on a healthy box
# for weeks. See FIX-tiktok-8443-binding.md.
#
# Columns:
#   unit    systemd unit name
#   port    localhost port the service answers on
#   dir     working directory, relative to the repo root (empty if none)
#   label   human-readable name used in script output
#   kind    api    -> health-checked with GET /api/health
#           studio -> only checked for a reachable port
#   public  public Tailscale Funnel base URL, or empty if not exposed to the
#           internet. {funnel} expands to the Funnel hostname.
#
# unit|port|dir|label|kind|public
tiksurfer|8443|databases/tiktok|Tik Surfer|api|https://{funnel}:8443
insta-surfer|8442|databases/instagram|Insta Surfer|api|https://{funnel}
prisma-tiktok|5555|databases/tiktok|Prisma Studio (TikTok)|studio|https://{funnel}:5555
prisma-insta|5556|databases/instagram|Prisma Studio (Insta)|studio|
